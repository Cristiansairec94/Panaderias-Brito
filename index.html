  <script>

      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],

  <style>
    body {
      background-color: #f5f5f4;
      font-family: 'Montserrat', sans-serif;
    }

    /* Scrollbar moderno & elegante Panadería Brito */
    ::-webkit-scrollbar {
      width: 11px;
      height: 11px;
    }

    ::-webkit-scrollbar-track {
      background: #ede8e1;
      border-radius: 9999px;
      margin: 8px 3px;
      border: 1px solid #e2dbd0;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
      border-radius: 9999px;
      border: 2px solid #ede8e1;
      box-shadow: 0 1px 3px rgba(45, 24, 16, 0.2);
      transition: background 0.2s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
      box-shadow: 0 2px 5px rgba(180, 83, 9, 0.4);
    }

    ::-webkit-scrollbar-thumb:active {
      background: #78350f;
    }

    /* Ocultar botones de flecha toscos por defecto */
    ::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0;
    }

    ::-webkit-scrollbar-corner {
      background: transparent;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #d97706 #ede8e1;
    }

    html, body {
      scroll-behavior: smooth;
    }
    
    @media print {
      body * {
        visibility: hidden !important;
      }
      #printable-ticket, #printable-ticket * {
        visibility: visible !important;
      }
      #printable-ticket {
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm !important;
        margin: 0 !important;
        padding: 8px !important;
        background: white !important;
        color: black !important;
        border: none !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>

    const CATEGORIES = [

      { id: "pizza_20", label: "Pizza $20", icon: "🍕" },

    ];

    function matchesPosCategory(prod, catId) {
      if (catId === "all") return true;
      if (prod.category === catId) return true;

      const name = (prod.name || "").toLowerCase();
      const cat = (prod.category || "").toLowerCase();
      const price = prod.price;

      switch (catId) {
        case "bolillo_3":
          return name.includes("bolillo") || price === 3 || price === 5;
        case "telera_350":
          return name.includes("telera") || price === 3.5 || price === 6;
        case "pambazo_4":
          return name.includes("pambazo") || price === 4;
        case "dulce_10":
          return (cat === "pan_dulce" && price <= 10) || name.includes("concha") || price === 10;
        case "dulce_12":
          return (cat === "pan_dulce" && price === 12) || price === 12;
        case "rollos_15":
          return name.includes("rollo") || name.includes("cuerno") || name.includes("oreja") || price === 15 || price === 14;
        case "strudel_18":
          return name.includes("strudel") || name.includes("empanada") || price === 18;
        case "pastes_20":
          return name.includes("paste") || price === 20;
        case "pizza_20":
          return name.includes("pizza") || price === 20;
        case "pay_25":
          return name.includes("pay") || cat === "pasteleria" || cat === "bebidas" || price === 25 || price === 40 || price === 45 || price === 30;
        case "cuerno_65":
          return name.includes("cuerno grande") || price >= 50;
        case "abarrotes":
          return cat === "abarrotes" || name.includes("leche");
        case "materia_prima":
          return cat === "materia_prima" || name.includes("harina");
        default:
          return prod.category === catId;
      }
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat("es-MX", {
        style: "currency",
        currency: "MXN",
      }).format(amount || 0);
    }

    function App() {
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem("brito_products_v2");
        return saved ? JSON.parse(saved) : PRODUCTS_DATA;
      });

      const [cart, setCart] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState("all");
      const [search, setSearch] = useState("");
      const [paymentMethod, setPaymentMethod] = useState("efectivo");
      const [cashGiven, setCashGiven] = useState("");
      
      // Shift & Expenses
      const [cashierName, setCashierName] = useState("Don Toño Brito");
      const [shiftName, setShiftName] = useState("Turno Matutino");
      const [initialCashFund, setInitialCashFund] = useState(500);
      const [expensesList, setExpensesList] = useState(() => {
        const saved = localStorage.getItem("brito_expenses");
        return saved ? JSON.parse(saved) : [
          { id: "EXP-01", amount: 145, category: "limpieza", description: "2 escobas y 1 bolsa de jabón Roma para charolas", cashier: "Don Toño Brito", date: "Hoy, 09:30 AM" },
          { id: "EXP-02", amount: 300, category: "retiro_personal", description: "Retiro para gastos personales de Don Toño", cashier: "Don Toño Brito", date: "Hoy, 11:15 AM" }
        ];
      });

      const [salesList, setSalesList] = useState(() => {
        const saved = localStorage.getItem("brito_sales");
        return saved ? JSON.parse(saved) : [];
      });

      // Modals
      const [showTicket, setShowTicket] = useState(false);
      const [showExpenses, setShowExpenses] = useState(false);
      const [showDrawerModal, setShowDrawerModal] = useState(false);
      const [showCategoryPanel, setShowCategoryPanel] = useState(false);
      const [showOperationsMenu, setShowOperationsMenu] = useState(false);
      const [completedSale, setCompletedSale] = useState(null);
      const [shiftModalTab, setShiftModalTab] = useState("cuentas");
      const [countedCashInput, setCountedCashInput] = useState("");
      const [hasAcceptedShift, setHasAcceptedShift] = useState(false);
      const [nextCashier, setNextCashier] = useState("Cajero 2 - Turno Tarde");
      const [nextShift, setNextShift] = useState("Turno Vespertino (14:00 - 22:00)");

      // Shift Lock State (Candado de Seguridad por Cierre de Turno de Cajera)
      const [isShiftLocked, setIsShiftLocked] = useState(() => {
        try {
          return localStorage.getItem("brito_pos_shift_locked") === "true";
        } catch (e) {
          return false;
        }
      });
      const [lockUser, setLockUser] = useState("");
      const [lockPassword, setLockPassword] = useState("");
      const [lockError, setLockError] = useState("");
      const [showLockPassword, setShowLockPassword] = useState(false);

      const handleUnlockShift = (e) => {
        e.preventDefault();
        if (lockUser.trim().toLowerCase() === "admin" && lockPassword.trim() === "admin") {
          setIsShiftLocked(false);
          setLockUser("");
          setLockPassword("");
          setLockError("");
          setShowLockPassword(false);
          try {
            localStorage.removeItem("brito_pos_shift_locked");
          } catch (e) {}
        } else {
          setLockError("Usuario o contraseña de encargada incorrectos.");
        }
      };

      useEffect(() => {
        localStorage.setItem("brito_products_v2", JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem("brito_expenses", JSON.stringify(expensesList));
      }, [expensesList]);

      useEffect(() => {
        localStorage.setItem("brito_sales", JSON.stringify(salesList));
      }, [salesList]);

      // Filter products
      const filtered = useMemo(() => {
        return products.filter((p) => {
          const matchCat = matchesPosCategory(p, selectedCategory);
          const matchSearch = p.name.toLowerCase().includes(search.toLowerCase()) ||
                              (p.description && p.description.toLowerCase().includes(search.toLowerCase()));
          return matchCat && matchSearch;
        });
      }, [products, selectedCategory, search]);

      const addToCart = (product) => {
        if (product.stock <= 0) return;
        setCart((prev) => {
          const exist = prev.find((i) => i.product.id === product.id);
          if (exist) {
            if (exist.quantity >= product.stock) return prev;
            return prev.map((i) => i.product.id === product.id ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [...prev, { product, quantity: 1 }];
        });
      };

      const addMultipleToCart = (product, count, e) => {
        if (e) e.stopPropagation();
        setCart((prev) => {
          const exist = prev.find((i) => i.product.id === product.id);
          if (exist) {
            return prev.map((i) => i.product.id === product.id ? { ...i, quantity: i.quantity + count } : i);
          }
          return [...prev, { product, quantity: count }];
        });
      };

      const updateQty = (id, delta) => {
        setCart((prev) =>
          prev.map((i) => {
            if (i.product.id === id) {
              const newQ = i.quantity + delta;
              return newQ > 0 ? { ...i, quantity: newQ } : null;
            }
            return i;
          }).filter(Boolean)
        );
      };

      const setExactQty = (id, qty) => {
        if (qty <= 0) {
          setCart((prev) => prev.filter((i) => i.product.id !== id));
          return;
        }
        setCart((prev) =>
          prev.map((i) => (i.product.id === id ? { ...i, quantity: qty } : i))
        );
      };

      const total = cart.reduce((sum, i) => sum + i.product.price * i.quantity, 0);
      const totalPieces = cart.reduce((sum, i) => sum + i.quantity, 0);
      const parsedCash = Number(cashGiven) || 0;
      const change = paymentMethod === "efectivo" && parsedCash >= total ? parsedCash - total : 0;
      const isValid = paymentMethod !== "efectivo" || parsedCash >= total;

      // Balances
      const totalCashSales = salesList.filter((s) => s.paymentMethod === "efectivo").reduce((sum, s) => sum + s.total, 0);
      const totalExpenses = expensesList.reduce((sum, e) => sum + e.amount, 0);
      const cashInDrawer = initialCashFund + totalCashSales - totalExpenses;
      const totalStockVal = products.reduce((sum, p) => sum + p.stock * p.price, 0);
      const totalPiecesInStock = products.reduce((sum, p) => sum + p.stock, 0);

      const handleCheckout = () => {
        if (cart.length === 0 || !isValid) return;

        // Descontar stock
        setProducts((prev) =>
          prev.map((prod) => {
            const bought = cart.find((ci) => ci.product.id === prod.id);
            return bought ? { ...prod, stock: Math.max(0, prod.stock - bought.quantity) } : prod;
          })
        );

        const newSale = {
          id: `POS-${Math.floor(100000 + Math.random() * 900000)}`,
          date: new Date().toLocaleString("es-MX", { dateStyle: "short", timeStyle: "short" }),
          items: [...cart],
          total,
          paymentMethod,
          cashier: cashierName,
          cashGiven: paymentMethod === "efectivo" ? parsedCash : undefined,
          change: paymentMethod === "efectivo" ? change : undefined,
        };

        setCompletedSale(newSale);
        setSalesList((prev) => [newSale, ...prev]);
        setShowTicket(true);
      };

      const resetSale = () => {
        setCart([]);
        setCashGiven("");
        setShowTicket(false);
        setCompletedSale(null);
      };

      const catalogScrollRef = useRef(null);

      const scrollToTop = () => {
        if (catalogScrollRef.current) {
          catalogScrollRef.current.scrollTo({ top: 0, behavior: "smooth" });
        }
      };

      const scrollToBottom = () => {
        if (catalogScrollRef.current) {
          catalogScrollRef.current.scrollTo({
            top: catalogScrollRef.current.scrollHeight,
            behavior: "smooth",
          });
        }
      };

      return (
        <div className="flex h-screen overflow-hidden bg-stone-100">
          {/* Main POS Catalog (Left) con espacio y scrollbar estilizado */}
          <div 
            ref={catalogScrollRef}
            className="flex-1 flex flex-col min-w-0 px-4 lg:px-5 pb-6 pt-0 pr-3 sm:pr-4 overflow-y-auto scroll-smooth relative"
          >
            {/* Top Fixed Header Toolbar & Category Panel Container (Anclado y sellado al ras para tapar el espacio) */}
            <div className={`sticky top-0 z-30 -mx-4 lg:-mx-5 px-4 py-2.5 lg:px-5 lg:py-3 bg-stone-100 border-b border-stone-200/90 shadow-sm transition-all duration-200 ${showCategoryPanel ? "space-y-2 pb-2.5 mb-3" : "mb-4"}`}>
              <div className="flex items-center justify-between gap-3 w-full">
                {/* Buscador de Productos (Grande y Cómodo) */}
                <div className="relative flex-1 max-w-2xl">
                  <span className="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400 text-base">🔍</span>
                  <input
                    type="text"
                    placeholder="Buscar dulce $10, bolillo, telera, pizza, strudel..."
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    className="w-full pl-12 pr-10 py-3.5 bg-white rounded-2xl border-2 border-stone-300 focus:border-amber-600 focus:outline-none shadow-xs text-sm font-bold text-stone-800 placeholder:text-stone-400 transition-all"
                  />
                  {search && (
                    <button
                      type="button"
                      onClick={() => setSearch("")}
                      className="absolute right-3.5 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-700 text-sm p-1"
                    >
                      ✕
                    </button>
                  )}
                </div>

                {/* Botón Grande: Categorías y Precios */}
                <div className="relative shrink-0">
                  <button
                    type="button"
                    onClick={() => setShowCategoryPanel(!showCategoryPanel)}
                    className="flex items-center gap-2.5 px-4 sm:px-5 py-3.5 rounded-2xl border-2 border-amber-400 bg-white hover:bg-amber-50 text-stone-900 text-sm sm:text-base font-black transition-all active:scale-95 shadow-sm whitespace-nowrap"
                    title="Mostrar u ocultar panel de categorías y precios"
                  >
                    <span className="text-xl">🧺</span>
                    <span>Categorías y Precios</span>
                    {selectedCategory !== "all" && (
                      <span
                        onClick={(e) => {
                          e.stopPropagation();
                          setSelectedCategory("all");
                          setShowCategoryPanel(false);
                        }}
                        className="w-5 h-5 rounded-full bg-amber-500 hover:bg-amber-600 text-white flex items-center justify-center text-xs font-black transition-transform active:scale-90 ml-0.5"
                        title="Ver todo el pan y quitar filtro"
                      >
                        ✕
                      </span>
                    )}
                    <span className="text-sm text-stone-400">▾</span>
                  </button>
                </div>

                {/* Botón Gasto Rápido */}
                <div className="relative shrink-0">
                  <button
                    type="button"
                    onClick={() => setShowExpenses(true)}
                    className="flex items-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-3.5 rounded-2xl border-2 border-rose-200 hover:border-rose-400 bg-rose-50 hover:bg-rose-100/80 text-rose-900 text-sm sm:text-base font-black transition-all active:scale-95 shadow-xs whitespace-nowrap"
                    title="Registrar salida o gasto de dinero"
                  >
                    <span className="text-lg">💸</span>
                    <span>Gasto</span>
                  </button>
                </div>

                {/* Botón Grande: Caja & Turno (Abre directamente el Corte de Caja) */}
                <div className="relative shrink-0">
                  <button
                    type="button"
                    onClick={() => {
                      setShiftModalTab("cambio");
                      setShowDrawerModal(true);
                    }}
                    className="flex items-center gap-2.5 px-4 sm:px-5 py-3.5 rounded-2xl border-2 border-amber-900 bg-[#2d1810] hover:bg-[#3d2015] text-amber-100 text-sm sm:text-base font-black transition-all active:scale-95 shadow-md ring-2 ring-amber-500/40 whitespace-nowrap"
                    title="Abrir Corte de Caja y Cierre de Turno directamente"
                  >
                    <span className="w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0 shadow-xs" />
                    <span className="text-xl">💼</span>
                    <span>Caja & Turno</span>
                  </button>
                </div>
              </div>

                                  ? "🟢 Cierre de Turno Conforme: Todo está bien y no hay detalles en caja"
                                  : Number(countedCashInput) > cashInDrawer
                                  ? "🟡 Detalle en Cierre: Sobrante detectado en caja"
                                  : "🔴 Detalle en Cierre: Faltante detectado en caja"}
                              </span>
                              <span className={`text-xs sm:text-sm font-bold block mt-0.5 ${
                                Number(countedCashInput) === cashInDrawer ? "text-emerald-800" : Number(countedCashInput) > cashInDrawer ? "text-blue-800" : "text-rose-800"
                              }`}>
                                {Number(countedCashInput) === cashInDrawer
                                  ? "Cuentas cuadradas al 100%. El dinero en caja coincide exactamente con el sistema ($0.00)."
                                  : `Diferencia de ${formatCurrency(Number(countedCashInput) - cashInDrawer)}. Se registrará el detalle en el comprobante del turno.`}
                              </span>
                            </div>
                          </div>
                          <span className={`shrink-0 px-3.5 py-1.5 rounded-xl font-black text-xs sm:text-sm uppercase tracking-wide shadow-xs ${
                            Number(countedCashInput) === cashInDrawer ? "bg-emerald-200 text-emerald-950 border border-emerald-300" : Number(countedCashInput) > cashInDrawer ? "bg-blue-200 text-blue-900" : "bg-rose-200 text-rose-900"
                          }`}>
                            {Number(countedCashInput) === cashInDrawer ? "Sin Detalles ✓" : formatCurrency(Number(countedCashInput) - cashInDrawer)}
                          </span>
                        </div>
                      )}
                    </div>

                    {/* 3. Casilla de Confirmación y Botón Final de Cierre de Turno */}
                    <div className="space-y-3 pt-1">
                      <label className={`flex items-center gap-3.5 p-4 sm:p-4.5 rounded-2xl sm:rounded-3xl border-2 cursor-pointer select-none transition-all duration-300 ${
                        hasAcceptedShift
                          ? "bg-emerald-50/90 border-emerald-400 shadow-md ring-2 ring-emerald-500/20"
                          : "bg-amber-50/90 border-amber-300 hover:border-amber-400"
                      }`}>
                        <input
                          type="checkbox"
                          checked={hasAcceptedShift}
                          onChange={(e) => setHasAcceptedShift(e.target.checked)}
                          className="w-5 h-5 sm:w-6 sm:h-6 rounded-lg accent-emerald-600 cursor-pointer shrink-0 transition-transform active:scale-90"
                        />
                        <span className="text-sm sm:text-base font-black text-stone-900 leading-snug">
                          Confirmo el <strong className="text-amber-900">Cierre de Turno</strong>: todo está bien, conté el dinero ({countedCashInput ? formatCurrency(Number(countedCashInput)) : "$0.00"}) y no hay detalles pendientes en caja.
                        </span>
                      </label>

                      <button
                        type="button"
                        disabled={!countedCashInput || !hasAcceptedShift}
                        onClick={() => {
                          const prevCashier = cashierName;
                          setCashierName(nextCashier);
                          setShiftName(nextShift);
                          setExpensesList([]);
                          setSalesList([]);
                          setShowDrawerModal(false);
                          setCountedCashInput("");
                          setHasAcceptedShift(false);
                          setIsShiftLocked(true);
                          try {
                            localStorage.setItem("brito_pos_shift_locked", "true");
                          } catch (e) {}
                        }}
                        className={`w-full py-5 px-6 rounded-2xl sm:rounded-3xl font-black text-base sm:text-lg tracking-wide shadow-xl transition-all duration-300 flex items-center justify-center gap-3 group active:scale-98 ${
                          !countedCashInput || !hasAcceptedShift
                            ? "bg-stone-300 text-stone-500 cursor-not-allowed opacity-60"
                            : "bg-gradient-to-r from-emerald-600 via-emerald-700 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white shadow-emerald-700/30 hover:shadow-2xl hover:scale-[1.01] animate-pulse"
                        }`}
                      >
                        <span className="text-xl group-hover:scale-125 transition-transform duration-300">🔒</span>
                        <span>CERRAR TURNO Y ENTREGAR CAJA ({nextCashier}) ➔</span>
                      </button>
                    </div>
                  </div>
                </div>

                {/* Footer */}
                <div className="p-4 px-6 bg-white border-t border-stone-200 flex items-center justify-between">
                  <span className="text-xs font-bold text-stone-500">
                    Panaderías Brito • Sucursal Matriz
                  </span>
                  <button
                    type="button"
                    onClick={() => setShowDrawerModal(false)}
                    className="px-6 py-3 bg-stone-100 hover:bg-stone-200 text-stone-800 font-black rounded-xl text-xs sm:text-sm transition-colors"
                  >
                    Cerrar Ventana
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PANTALLA DE BLOQUEO CON CANDADO DE SEGURIDAD (Cierre de Turno de Cajera) */}
          {isShiftLocked && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-stone-950/95 backdrop-blur-xl p-4 animate-in fade-in duration-300">
              <div className="absolute w-96 h-96 bg-amber-600/10 rounded-full blur-3xl pointer-events-none -top-20 -left-20 animate-pulse"></div>
              <div className="absolute w-96 h-96 bg-orange-600/10 rounded-full blur-3xl pointer-events-none -bottom-20 -right-20 animate-pulse"></div>

              <div className="relative bg-white rounded-3xl shadow-2xl max-w-md w-full overflow-hidden border-2 border-amber-900/30 text-stone-900 animate-in zoom-in-95 duration-200">
                {/* Cabecera Café Tostado Oficial Panadería Brito */}
                <div className="bg-gradient-to-r from-[#24130c] via-[#2d1810] to-[#3d1d11] p-6 text-white text-center relative overflow-hidden">
                  <div className="relative z-10 space-y-2">
                    {/* Candado Animado Dorado */}
                    <div className="w-20 h-20 mx-auto bg-gradient-to-tr from-amber-500 to-orange-500 rounded-3xl flex items-center justify-center shadow-xl shadow-amber-500/30 ring-4 ring-amber-400/40 text-4xl animate-bounce">
                      🔒
                    </div>
                    <h2 className="text-2xl font-black text-white tracking-wide">
                      Turno Cerrado
                    </h2>
                    <p className="text-xs text-amber-200 font-bold max-w-xs mx-auto">
                      Terminal de cobro bloqueada con candado de seguridad
                    </p>
                  </div>
                </div>

                {/* Cuerpo del Bloqueo */}
                <div className="p-6 space-y-4">
                  <div className="bg-amber-50/80 border border-amber-200 p-3.5 rounded-2xl text-xs space-y-1 text-stone-700">
                    <p className="font-bold flex items-center gap-1.5 text-stone-900">
                      <span>🛡️</span> Acceso para Encargada de Turno
                    </p>
                    <p className="text-[11px] text-stone-600 leading-relaxed">
                      El turno de la cajera ha sido cerrado. Por seguridad, la encargada debe ingresar sus credenciales para habilitar la terminal y aperturar el siguiente turno.
                    </p>
                  </div>

                  {lockError && (
                    <div className="p-3 bg-rose-50 border-2 border-rose-300 text-rose-900 text-xs font-black rounded-2xl flex items-center gap-2">
                      <span>⚠️</span> {lockError}
                    </div>
                  )}

                  <form onSubmit={handleUnlockShift} className="space-y-3.5 text-xs">
                    <div>
                      <label className="font-black text-stone-800 uppercase tracking-wider block mb-1">
                        Usuario de Encargada:
                      </label>
                      <input
                        type="text"
                        required
                        autoFocus
                        placeholder="admin"
                        value={lockUser}
                        onChange={(e) => {
                          setLockUser(e.target.value);
                          setLockError("");
                        }}
                        className="w-full px-4 py-3 bg-stone-50 border-2 border-stone-200 focus:border-amber-600 focus:bg-white rounded-xl text-sm font-bold text-stone-900 focus:outline-none transition-all"
                      />
                    </div>

                    <div>
                      <label className="font-black text-stone-800 uppercase tracking-wider block mb-1">
                        Contraseña:
                      </label>
                      <div className="relative">
                        <input
                          type={showLockPassword ? "text" : "password"}
                          required
                          placeholder="••••••"
                          value={lockPassword}
                          onChange={(e) => {
                            setLockPassword(e.target.value);
                            setLockError("");
                          }}
                          className="w-full pl-4 pr-11 py-3 bg-stone-50 border-2 border-stone-200 focus:border-amber-600 focus:bg-white rounded-xl text-sm font-bold text-stone-900 focus:outline-none transition-all"
                        />
                        <button
                          type="button"
                          onClick={() => setShowLockPassword(!showLockPassword)}
                          className="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-700 p-1 font-bold text-xs"
                        >
                          {showLockPassword ? "🙈" : "👁️"}
                        </button>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-4 bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 hover:from-amber-600 hover:to-orange-600 text-white font-black rounded-2xl text-sm shadow-lg shadow-amber-600/30 transition-all active:scale-95 flex items-center justify-center gap-2 mt-2"
                    >
                      <span>🔓</span>
                      <span>Desbloquear Terminal & Iniciar Turno</span>
                    </button>
                  </form>

                  <div className="text-center pt-1 border-t border-stone-100">
                    <span className="text-[11px] text-stone-400 font-bold">
                      Panaderías Brito • Don Antonio Brito
                    </span>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
