        image: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=800&auto=format&fit=crop&q=80"
      }
    ];

    const CATEGORIES = [
      { id: "all", label: "Todo", icon: "🧺" },
      { id: "bolillo_3", label: "Bolillo $3", icon: "🍞" },
      { id: "telera_350", label: "Telera $3.50", icon: "🥪" },
      { id: "pambazo_4", label: "Pambazo $4", icon: "🥖" },
      { id: "dulce_10", label: "Dulce $10", icon: "🥐" },
      { id: "dulce_12", label: "Dulce $12", icon: "🍫" },
      { id: "rollos_15", label: "Rollos $15", icon: "🥨" },
      { id: "strudel_18", label: "Strudel $18", icon: "🥧" },
      { id: "pastes_20", label: "Pastes $20", icon: "🥟" },
      { id: "pizza_20", label: "Pizza $20", icon: "🍕" },
      { id: "pay_25", label: "Pay $25", icon: "🍰" },
      { id: "cuerno_65", label: "Cuerno $65", icon: "🥐" },
    ];

    function formatCurrency(amount) {
      return new Intl.NumberFormat("es-MX", {
        style: "currency",
        currency: "MXN",
      }).format(amount || 0);
    }

    function App() {
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem("brito_products_v2");
        return saved ? JSON.parse(saved) : PRODUCTS_DATA;
      });

      const [cart, setCart] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState("all");
      const [search, setSearch] = useState("");
      const [paymentMethod, setPaymentMethod] = useState("efectivo");
      const [cashGiven, setCashGiven] = useState("");
      
      // Shift & Expenses
      const [cashierName, setCashierName] = useState("Don Toño Brito");
      const [shiftName, setShiftName] = useState("Turno Matutino");
      const [initialCashFund, setInitialCashFund] = useState(500);
      const [expensesList, setExpensesList] = useState(() => {
        const saved = localStorage.getItem("brito_expenses");
        return saved ? JSON.parse(saved) : [
          { id: "EXP-01", amount: 145, category: "limpieza", description: "2 escobas y 1 bolsa de jabón Roma para charolas", cashier: "Don Toño Brito", date: "Hoy, 09:30 AM" },
          { id: "EXP-02", amount: 300, category: "retiro_personal", description: "Retiro para gastos personales de Don Toño", cashier: "Don Toño Brito", date: "Hoy, 11:15 AM" }
        ];
      });

      const [salesList, setSalesList] = useState(() => {
        const saved = localStorage.getItem("brito_sales");
        return saved ? JSON.parse(saved) : [];
      });

      // Modals
      const [showTicket, setShowTicket] = useState(false);
      const [showExpenses, setShowExpenses] = useState(false);
      const [showDrawerModal, setShowDrawerModal] = useState(false);
      const [showCategoryPanel, setShowCategoryPanel] = useState(true);
      const [showOperationsMenu, setShowOperationsMenu] = useState(false);
      const [completedSale, setCompletedSale] = useState(null);

      useEffect(() => {
        localStorage.setItem("brito_products_v2", JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem("brito_expenses", JSON.stringify(expensesList));
      }, [expensesList]);

      useEffect(() => {
        localStorage.setItem("brito_sales", JSON.stringify(salesList));
      }, [salesList]);

      // Filter products
      const filtered = useMemo(() => {
        return products.filter((p) => {
          const matchCat = selectedCategory === "all" || p.category === selectedCategory;
          const matchSearch = p.name.toLowerCase().includes(search.toLowerCase()) ||
                              (p.description && p.description.toLowerCase().includes(search.toLowerCase()));
          return matchCat && matchSearch;
        });
      }, [products, selectedCategory, search]);

      const addToCart = (product) => {
        if (product.stock <= 0) return;
        setCart((prev) => {
          const exist = prev.find((i) => i.product.id === product.id);
          if (exist) {
            if (exist.quantity >= product.stock) return prev;
            return prev.map((i) => i.product.id === product.id ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [...prev, { product, quantity: 1 }];
        });
      };

      const addMultipleToCart = (product, count, e) => {
        if (e) e.stopPropagation();
        if (product.stock <= 0) return;
        setCart((prev) => {
          const exist = prev.find((i) => i.product.id === product.id);
          if (exist) {
            const newQ = Math.min(product.stock, exist.quantity + count);
            return prev.map((i) => i.product.id === product.id ? { ...i, quantity: newQ } : i);
          }
          return [...prev, { product, quantity: Math.min(product.stock, count) }];
        });
      };

      const updateQty = (id, delta) => {
        const prod = products.find((p) => p.id === id);
        setCart((prev) =>
          prev.map((i) => {
            if (i.product.id === id) {
              const newQ = i.quantity + delta;
              if (prod && newQ > prod.stock) return i;
              return newQ > 0 ? { ...i, quantity: newQ } : null;
            }
            return i;
          }).filter(Boolean)
        );
      };

      const total = cart.reduce((sum, i) => sum + i.product.price * i.quantity, 0);
      const totalPieces = cart.reduce((sum, i) => sum + i.quantity, 0);
      const parsedCash = Number(cashGiven) || 0;
      const change = paymentMethod === "efectivo" && parsedCash >= total ? parsedCash - total : 0;
      const isValid = paymentMethod !== "efectivo" || parsedCash >= total;

      // Balances
      const totalCashSales = salesList.filter((s) => s.paymentMethod === "efectivo").reduce((sum, s) => sum + s.total, 0);
      const totalExpenses = expensesList.reduce((sum, e) => sum + e.amount, 0);
      const cashInDrawer = initialCashFund + totalCashSales - totalExpenses;
      const totalStockVal = products.reduce((sum, p) => sum + p.stock * p.price, 0);
      const totalPiecesInStock = products.reduce((sum, p) => sum + p.stock, 0);

      const handleCheckout = () => {
        if (cart.length === 0 || !isValid) return;

        // Descontar stock
        setProducts((prev) =>
          prev.map((prod) => {
            const bought = cart.find((ci) => ci.product.id === prod.id);
            return bought ? { ...prod, stock: Math.max(0, prod.stock - bought.quantity) } : prod;
          })
        );

        const newSale = {
          id: `POS-${Math.floor(100000 + Math.random() * 900000)}`,
          date: new Date().toLocaleString("es-MX", { dateStyle: "short", timeStyle: "short" }),
          items: [...cart],
          total,
          paymentMethod,
          cashier: cashierName,
          cashGiven: paymentMethod === "efectivo" ? parsedCash : undefined,
          change: paymentMethod === "efectivo" ? change : undefined,
        };

        setCompletedSale(newSale);
        setSalesList((prev) => [newSale, ...prev]);
        setShowTicket(true);
      };

      const resetSale = () => {
        setCart([]);
        setCashGiven("");
        setShowTicket(false);
        setCompletedSale(null);
      };

      return (
        <div className="flex h-screen overflow-hidden bg-stone-100">
          {/* Main POS Catalog (Left) */}
          <div className="flex-1 flex flex-col min-w-0 p-4 lg:p-5 overflow-y-auto">
            {/* Top Fixed Header Toolbar (Perfectamente encuadrada y anclada a los bordes) */}
            <div className="sticky top-0 z-30 -mt-4 -mx-4 px-4 py-3 lg:-mt-5 lg:-mx-5 lg:px-5 lg:py-3.5 bg-stone-100 border-b border-stone-200/90 shadow-xs mb-5">
              <div className="flex items-center justify-between gap-3 w-full">
                {/* Buscador de Productos */}
                <div className="relative flex-1 max-w-2xl">
                  <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-xs">🔍</span>
                  <input
                    type="text"
                    placeholder="Buscar dulce $10, bolillo, telera, pizza, strudel..."
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    className="w-full pl-9 pr-8 py-2.5 bg-white rounded-xl border border-stone-300/80 focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-xs text-xs font-semibold text-stone-800 placeholder:text-stone-400"
                  />
                  {search && (
                    <button
                      type="button"
                      onClick={() => setSearch("")}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-700 text-xs"
                    >
                      ✕
                    </button>
                  )}
                </div>

                {/* Botón Discreto de Operaciones */}
                <div className="relative shrink-0">
                  <button
                    type="button"
                    onClick={() => setShowOperationsMenu(!showOperationsMenu)}
                    className={`flex items-center gap-2.5 px-4 py-2.5 rounded-xl border text-xs font-bold transition-all active:scale-95 shadow-xs ${
                      showOperationsMenu
                        ? "bg-[#2d1810] text-amber-50 border-amber-800 ring-2 ring-amber-600/30 font-black"
                        : "bg-white hover:bg-stone-50 text-stone-800 border-stone-300/80"
                    }`}
                    title="Administración de caja, gastos y turno"
                  >
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0 animate-pulse" />
                      <span className="text-sm">💼</span>
                      <span className="font-extrabold text-xs">Caja & Turno</span>
                    </div>
                    <span className="text-xs text-stone-400">▾</span>
                  </button>

                  {/* Menú Desplegable Flotante */}
                  {showOperationsMenu && (
                    <>
                      {/* Backdrop para cerrar al hacer clic afuera */}
                      <div
                        className="fixed inset-0 z-40"
                        onClick={() => setShowOperationsMenu(false)}
                      />

                      {/* Panel Flotante */}
                      <div className="absolute right-0 top-full mt-2.5 z-50 w-80 sm:w-96 bg-white/98 backdrop-blur-xl rounded-3xl p-4 border border-stone-200 shadow-2xl space-y-3 animate-in fade-in duration-150">
                        <div className="flex items-center justify-between pb-2 border-b border-stone-100">
                          <div className="flex items-center gap-2">
                            <span className="text-base">💼</span>
                            <span className="text-xs font-black text-stone-900 uppercase tracking-wider">
                              Operaciones de Turno
                            </span>
                          </div>
                          <button
                            type="button"
                            onClick={() => setShowOperationsMenu(false)}
                            className="text-stone-400 hover:text-stone-700 text-xs font-bold p-1 rounded-lg hover:bg-stone-100"
                          >
                            ✕ Cerrar
                          </button>
                        </div>

                        {/* Botón Principal: Arqueo y Dinero en Caja */}
                        <button
                          type="button"
                          onClick={() => {
                            setShowOperationsMenu(false);
                            setShowDrawerModal(true);
                          }}
                          className="w-full flex items-center justify-between p-3 rounded-2xl bg-[#2d1810] hover:bg-[#3e2723] text-white transition-all active:scale-98 shadow-sm border border-amber-900/60 text-left"
                        >
                          <div className="flex items-center gap-2.5">
                            <div className="p-2 bg-amber-500/20 rounded-xl text-amber-400 text-base">
                              💰
                            </div>
                            <div>
                              <span className="text-[10px] text-amber-300 font-medium block">
                                {cashierName} • {shiftName}
                              </span>
                              <span className="text-sm font-black text-white block">
                                Caja: {formatCurrency(cashInDrawer)}
                              </span>
                              <span className="text-[11px] text-stone-300">
                                Stock estimado: {formatCurrency(totalStockVal)}
                              </span>
                            </div>
                          </div>
                          <span className="text-[11px] font-bold text-amber-400 bg-amber-950/80 px-2.5 py-1 rounded-lg border border-amber-800/60">
                            Arqueo
                          </span>
                        </button>

                        {/* Acciones Secundarias: Gastos */}
                        <div className="grid grid-cols-1 gap-2">
                          <button
                            type="button"
                            onClick={() => {
                              setShowOperationsMenu(false);
                              setShowExpenses(true);
                            }}
                            className="flex items-center justify-between p-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200/90 text-left transition-all active:scale-95"
                          >
                            <div className="flex items-center gap-1.5 text-rose-700 text-xs font-bold">
                              <span>💸 Salidas y Gastos</span>
                            </div>
                            <span className="text-xs font-black text-rose-800">
                              -{formatCurrency(totalExpenses)}
                            </span>
                          </button>
                        </div>

                        {/* Estado */}
                        <div className="pt-2 border-t border-stone-100 flex items-center justify-between text-[11px] text-stone-500">
                          <div className="flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                            <span>Sistema Web en Línea</span>
                          </div>
                        </div>
                      </div>
                    </>
                  )}
                </div>
              </div>
            </div>

            {/* Fila 2: Tarjeta CATEGORÍAS Y PRECIOS (En flujo normal, nunca tapa imágenes) */}
            <div className="bg-white rounded-3xl p-3.5 sm:p-4 border border-stone-200 shadow-xs space-y-2.5 mb-5 shrink-0">
                {/* Cabecera */}
                <div className="flex items-center justify-between pb-2 border-b border-stone-100">
                  <div className="flex items-center gap-2">
                    <span className="text-amber-600 text-sm">🥞</span>
                    <h3 className="text-xs font-black text-stone-900 uppercase tracking-wider">
                      Categorías y Precios
                    </h3>
                    {selectedCategory !== "all" && (
                      <span className="text-[11px] font-bold text-amber-800 bg-amber-50 px-2.5 py-0.5 rounded-full border border-amber-200">
                        Filtro activo: {CATEGORIES.find((c) => c.id === selectedCategory)?.label}
                      </span>
                    )}
                  </div>

                  <div className="flex items-center gap-2">
                    {selectedCategory !== "all" && (
                      <button
                        type="button"
                        onClick={() => setSelectedCategory("all")}
                        className="text-xs font-black text-amber-900 hover:text-amber-950 px-2.5 py-1 rounded-xl bg-amber-50 hover:bg-amber-100 transition-colors"
                      >
                        Mostrar Todos los Precios
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => setShowCategoryPanel(!showCategoryPanel)}
                      className="text-[11px] font-bold text-stone-500 hover:text-stone-800 bg-stone-100 hover:bg-stone-200 px-3 py-1 rounded-full transition-colors"
                    >
                      {showCategoryPanel ? "Ocultar" : "Mostrar"}
                    </button>
                  </div>
                </div>

                {/* Cuadrícula de 12 Botones */}
                {showCategoryPanel && (
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2">
                    {CATEGORIES.map((cat) => {
                      const isSelected = selectedCategory === cat.id;
                      const count = cat.id === "all"
                        ? products.length
                        : products.filter((p) => p.category === cat.id || p.id === cat.id).length;

                      return (
                        <button
                          key={cat.id}
                          type="button"
                          onClick={() => {
                            if (isSelected && cat.id !== "all") {
                              setSelectedCategory("all");
                            } else {
                              setSelectedCategory(cat.id);
                            }
                          }}
                          className={`relative px-3 py-2 rounded-2xl text-xs font-bold transition-all duration-150 flex items-center justify-between border active:scale-95 ${
                            isSelected
                              ? "bg-[#2d1810] text-amber-50 shadow-md shadow-amber-950/20 font-black border-2 border-amber-500 ring-2 ring-amber-700/30"
                              : "bg-stone-50/80 hover:bg-amber-50/90 hover:border-amber-300 text-stone-800 border-stone-200/90"
                          }`}
                        >
                          {/* Icono + Nombre y Precio */}
                          <div className="flex items-center gap-2 min-w-0">
                            <span className="text-base shrink-0">{cat.icon}</span>
                            <span className="truncate font-bold">{cat.label}</span>
                          </div>

                          {/* Badge de Conteo y botón X si está seleccionado */}
                          <div className="flex items-center gap-1 shrink-0 ml-1">
                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-black ${
                              isSelected
                                ? "bg-amber-500 text-stone-950"
                                : "bg-stone-200/90 text-stone-600"
                            }`}>
                              {count}
                            </span>

                    <div className="flex justify-between text-rose-700"><span>🔻 (-) Salidas y Gastos:</span><span className="font-bold">-{formatCurrency(totalExpenses)}</span></div>
                    <div className="flex justify-between text-sm font-black border-t border-amber-200 pt-2 text-amber-900">
                      <span>DINERO ESPERADO EN CAJÓN:</span>
                      <span>{formatCurrency(cashInDrawer)}</span>
                    </div>
                  </div>

                  {/* Relevo de Turno */}
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      const form = e.target;
                      const nextCashier = form.nextCashier.value;
                      const nextShift = form.nextShift.value;
                      const notes = form.notes.value;

                      setCashierName(nextCashier);
                      setShiftName(nextShift);
                      setExpensesList([]);
                      setSalesList([]);
                      setShowDrawerModal(false);
                      alert(`🏁 ¡Corte de Caja Exitoso!\n\nEntregó: ${cashierName}\nRecibió: ${nextCashier}\nTurno: ${nextShift}\nEfectivo en Caja: ${formatCurrency(cashInDrawer)}\n\nSe ha notificado al administrador.`);
                    }}
                    className="p-4 bg-stone-50 rounded-2xl border space-y-3 text-xs"
                  >
                    <span className="font-bold text-stone-800 block">🏁 Realizar Relevo & Entrega de Turno:</span>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-[10px] font-bold text-stone-500 block">Cajero Entrante (Recibe):</label>
                        <select name="nextCashier" className="w-full p-2 border rounded-xl font-bold bg-white">
                          <option value="Cajero 2 - Turno Tarde">Cajero 2 - Turno Tarde</option>
                          <option value="Cajero 1 - Turno Mañana">Cajero 1 - Turno Mañana</option>
                          <option value="Don Toño Brito">Don Antonio Brito (Propietario)</option>
                          <option value="María Brito">María Brito</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-stone-500 block">Turno Siguiente:</label>
                        <select name="nextShift" className="w-full p-2 border rounded-xl font-bold bg-white">
                          <option value="Turno Vespertino (14:00 - 22:00)">Turno Vespertino</option>
                          <option value="Turno Matutino (06:00 - 14:00)">Turno Matutino</option>
                        </select>
                      </div>
                    </div>
                    <input name="notes" placeholder="Notas de entrega (ej. vitrina llena, todo en orden)..." className="w-full p-2 border rounded-xl" />
                    
                    <button type="submit" className="w-full py-3 bg-amber-950 hover:bg-black text-white font-black rounded-xl text-xs shadow-md">
                      🏁 Finalizar Corte y Entregar Turno
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
