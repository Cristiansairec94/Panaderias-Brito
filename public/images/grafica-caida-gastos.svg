<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- Degradado para la línea en caída -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Degradado para el área bajo la curva -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0.0" />
    </linearGradient>

    <!-- Degradados para las barras de caída -->
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filtro de resplandor sutil -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#f43f5e" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Contenedor general tipo tarjeta / símbolo -->
  <rect x="1" y="1" width="166" height="62" rx="14" fill="#4c0519" fill-opacity="0.5" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Líneas guía horizontales de la gráfica -->
  <line x1="12" y1="18" x2="86" y2="18" stroke="#fda4af" stroke-opacity="0.12" stroke-dasharray="2 2" stroke-width="1" />
  <line x1="12" y1="34" x2="86" y2="34" stroke="#fda4af" stroke-opacity="0.12" stroke-dasharray="2 2" stroke-width="1" />
  <line x1="12" y1="50" x2="86" y2="50" stroke="#fda4af" stroke-opacity="0.18" stroke-width="1" />

  <!-- Barras decrecientes que simbolizan la caída de gastos -->
  <rect x="15" y="20" width="10" height="30" rx="3" fill="url(#barGrad1)" />
  <rect x="32" y="27" width="10" height="23" rx="3" fill="url(#barGrad2)" />
  <rect x="49" y="35" width="10" height="15" rx="3" fill="url(#barGrad3)" />
  <rect x="66" y="42" width="10" height="8" rx="3" fill="url(#barGrad4)" />

  <!-- Área degradada bajo la curva en caída -->
  <path d="M 16 16 C 35 19, 52 35, 78 48 L 78 50 L 16 50 Z" fill="url(#areaGrad)" />

  <!-- Línea de tendencia en caída pronunciada con resplandor -->
  <path d="M 16 16 C 35 19, 52 35, 76 47" stroke="url(#lineGrad)" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)" />

  <!-- Flecha indicadora de caída en el extremo de la línea -->
  <path d="M 68 47 L 78 48 L 76 38" stroke="#fb7185" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Puntos clave en la gráfica -->
  <circle cx="16" cy="16" r="3" fill="#fb7185" stroke="#fff" stroke-width="1" />
  <circle cx="48" cy="30" r="2.2" fill="#f43f5e" />
  <circle cx="76" cy="47" r="2.5" fill="#e11d48" stroke="#fb7185" stroke-width="1" />

  <!-- Placa / Etiqueta que dice explícitamente "EN CAÍDA" -->
  <rect x="92" y="13" width="67" height="38" rx="10" fill="#881337" fill-opacity="0.65" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1" />
  
  <!-- Mini flecha de caída en la etiqueta -->
  <g transform="translate(98, 20)">
    <circle cx="7" cy="7" r="6.5" fill="#f43f5e" fill-opacity="0.3" />
    <path d="M 4 5.5 L 9.5 10.5 M 9.5 10.5 L 6.5 10.5 M 9.5 10.5 L 9.5 7.5" stroke="#fecdd3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Textos oficiales: "EN CAÍDA" y "GASTOS" -->
  <text x="115" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#ffffff" letter-spacing="0.6">EN CAÍDA</text>
  <text x="100" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#fda4af" letter-spacing="0.4">▼ GASTOS</text>
</svg>
