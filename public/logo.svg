<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <!-- Gradient for Orange Text -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8c38"/>
      <stop offset="50%" stop-color="#f56e18"/>
      <stop offset="100%" stop-color="#d64906"/>
    </linearGradient>

    <!-- Gradient for Cupcake Liner Base -->
    <linearGradient id="crimsonBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb2576"/>
      <stop offset="40%" stop-color="#e0105d"/>
      <stop offset="100%" stop-color="#a80540"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.25"/>
    </filter>
    
    <filter id="baseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#a80540" flood-opacity="0.3"/>
    </filter>

    <!-- Arc Path for "PANADERIA" -->
    <path id="panaderiaArc" d="M 60 145 A 200 135 0 0 1 440 145" fill="none" />
  </defs>

  <!-- 1. Top Arched "PANADERIA" Text -->
  <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="url(#orangeGrad)" stroke="#1a120b" stroke-width="4.5" stroke-linejoin="round" letter-spacing="3">
    <textPath href="#panaderiaArc" startOffset="50%" text-anchor="middle">
      PANADERIA
    </textPath>
  </text>

  <!-- 2. Mustache / Chef Hat Arch Dome Curve (Black) -->
  <path d="M 50 215 
           C 55 185, 75 160, 115 140 
           C 150 122, 175 130, 205 125 
           C 225 122, 235 115, 250 115 
           C 265 115, 275 122, 295 125 
           C 325 130, 350 122, 385 140 
           C 425 160, 445 185, 450 215 
           C 430 195, 395 175, 345 165 
           C 300 156, 275 162, 250 162 
           C 225 162, 200 156, 155 165 
           C 105 175, 70 195, 50 215 Z" 
        fill="#141416" 
        stroke="#000000" 
        stroke-width="2"
        filter="url(#subtleGlow)"/>

  <!-- 3. Subtitle "Bakery" -->
  <text x="250" y="210" text-anchor="middle" font-family="'Trebuchet MS', 'Arial Black', sans-serif" font-weight="800" font-size="34" fill="#a44210" stroke="#1a120b" stroke-width="2.5" letter-spacing="2">
    Bakery
  </text>

  <!-- 4. "Brito" Calligraphy / Brush Script -->
  <!-- Backing outline for ultra contrast -->
  <text x="250" y="325" text-anchor="middle" font-family="'Brush Script MT', 'Dancing Script', 'Segoe Script', 'Great Vibes', cursive" font-weight="bold" font-style="italic" font-size="122" fill="#141416" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" opacity="0.95">
    Brito
  </text>
  <!-- Foreground Script Text -->
  <text x="250" y="325" text-anchor="middle" font-family="'Brush Script MT', 'Dancing Script', 'Segoe Script', 'Great Vibes', cursive" font-weight="bold" font-style="italic" font-size="122" fill="#141416">
    Brito
  </text>

  <!-- 5. Fluted Cupcake / Pie Liner Base (Crimson & Cream) -->
  <g filter="url(#baseShadow)">
    <!-- Base Trapezoid Container -->
    <path d="M 85 365 
             C 140 378, 360 378, 415 365 
             L 385 458 
             C 340 472, 160 472, 115 458 
             Z" 
          fill="url(#crimsonBase)" 
          stroke="#730328" 
          stroke-width="3" />

    <!-- Cream/Vanilla Flutes / Vertical Pleats -->
    <!-- Center pleats -->
    <path d="M 250 377 L 250 464" stroke="#ffccd5" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 230 376 L 227 463" stroke="#ffe3e8" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 270 376 L 273 463" stroke="#ffe3e8" stroke-width="4.5" stroke-linecap="round"/>

    <path d="M 210 375 L 204 461" stroke="#ffccd5" stroke-width="4" stroke-linecap="round"/>
    <path d="M 290 375 L 296 461" stroke="#ffccd5" stroke-width="4" stroke-linecap="round"/>

    <path d="M 190 374 L 182 458" stroke="#ffe3e8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 310 374 L 318 458" stroke="#ffe3e8" stroke-width="4" stroke-linecap="round"/>

    <path d="M 170 373 L 160 455" stroke="#ffccd5" stroke-width="4" stroke-linecap="round"/>
    <path d="M 330 373 L 340 455" stroke="#ffccd5" stroke-width="4" stroke-linecap="round"/>

    <path d="M 150 371 L 138 451" stroke="#ffe3e8" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 350 371 L 362 451" stroke="#ffe3e8" stroke-width="3.5" stroke-linecap="round"/>

    <path d="M 130 369 L 118 446" stroke="#ffccd5" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 370 369 L 382 446" stroke="#ffccd5" stroke-width="3.5" stroke-linecap="round"/>

    <path d="M 110 367 L 98 440" stroke="#ffe3e8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 390 367 L 402 440" stroke="#ffe3e8" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
